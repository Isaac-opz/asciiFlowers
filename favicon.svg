<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3213f"/>
      <stop offset="1" stop-color="#8e001b"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5068"/>
      <stop offset="1" stop-color="#c80f2d"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- stem and leaves -->
    <path d="M32 36 C32.5 45 31.5 53 29.5 61" stroke="#2c7428" stroke-width="3.4" fill="none"/>
    <path d="M30.8 51 C23.5 50.5 19 46 18.5 40.5 C25 41 29.5 45 30.8 51Z" fill="#3f9a36" stroke="#245f22" stroke-width="1"/>
    <path d="M31.8 46.5 C36.5 42.5 42 42.5 46.5 38.5 C40.5 35.5 34.5 39.5 31.8 46.5Z" fill="#3f9a36" stroke="#245f22" stroke-width="1"/>
    <!-- outer petals, scalloped along the top -->
    <path d="M12 19 C11.5 10.5 18 6 24 8.5 C27 2.5 37 2.5 40 8.5 C46 6 52.5 10.5 52 19 C51.5 31 43 38.5 32 38.5 C21 38.5 12.5 31 12 19Z"
          fill="url(#back)" stroke="#55000f" stroke-width="1.2"/>
    <!-- the tight inner cup with its spiral -->
    <path d="M21 16.5 C21 10.5 26.5 8.5 32 10.5 C37.5 8.5 43 10.5 43 16.5 C43 22.5 38 26 32 26 C26 26 21 22.5 21 16.5Z"
          fill="url(#cup)" stroke="#55000f" stroke-width="1.2"/>
    <path d="M32.5 18.5 C29.8 18.5 29.3 14.8 32 14.3 C35.4 13.7 36.4 18.6 33.2 20.6 C29.4 23 25.6 19.6 26.6 15.4 C27.4 12.3 30.6 11.4 33.6 12"
          fill="none" stroke="#6a0014" stroke-width="1.6"/>
    <!-- front petals wrapping the cup -->
    <path d="M12.3 19.5 C14.5 30.5 22.5 37.5 32 38.5 C27.5 33.5 24.5 27.5 25.5 21.5 C21 23.5 15.5 23 12.3 19.5Z"
          fill="#b8001f" stroke="#55000f" stroke-width="1.2"/>
    <path d="M51.7 19.5 C49.5 30.5 41.5 37.5 32 38.5 C36.5 33.5 39.5 27.5 38.5 21.5 C43 23.5 48.5 23 51.7 19.5Z"
          fill="#c90024" stroke="#55000f" stroke-width="1.2"/>
    <path d="M24.5 26 C27.5 30.5 36.5 30.5 39.5 26 C38.8 32.5 35.8 37 32 38.5 C28.2 37 25.2 32.5 24.5 26Z"
          fill="#9c001c" stroke="#55000f" stroke-width="1.2"/>
    <!-- a little light on the lips of the petals -->
    <path d="M26 9.6 C28.5 8.6 30.5 9 32 10" fill="none" stroke="#ff8a99" stroke-width="1.1"/>
    <path d="M15.5 22.5 C17.5 27.5 21 31.5 25.5 34" fill="none" stroke="#e8364f" stroke-width="1"/>
  </g>
</svg>
